# 硅谷甄选前端站点配置（构建进 Nginx 镜像：/etc/nginx/conf.d/default.conf）
server {
    listen 80;
    server_name _;

    # 上传图片等请求体放宽上限（Nginx 默认 1m，商品图可能超过）
    client_max_body_size 20m;

    # gzip 压缩，减小 JS/CSS 传输体积
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 日志写文件（该路径已挂载到宿主机 deploy/logs/nginx/，可直接查看）
    access_log /var/log/nginx/host/access.log;
    error_log  /var/log/nginx/host/error.log;

    # 前端 SPA：Vue Router history 模式下，刷新深链接时回退到 index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代：/admin/ 开头 → 后端容器 8000 端口
    # （backend 是 docker-compose 里的服务名，同网络内自动解析）
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后端静态资源（上传的图片）：/static/ 开头 → 后端容器
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
